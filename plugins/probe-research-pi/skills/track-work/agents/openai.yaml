interface:
  display_name: "Track Work"
  short_description: "The tracking switch, and everything recorded while it is on"
  default_prompt: "Use $track-work to register any shape of the team's ML work before it starts and record everything it produces at the moment it happens — files to artifacts, numbers to metrics, decisions to notes, inputs into the snapshot — while keeping visible entity Markdown and hidden handoff notes current. Flip tracking off or on for this conversation only with an explicit `off`/`on`; your own bare invocation loads guidance and never flips (bare is the researcher's toggle, typed by them, not yours)."
