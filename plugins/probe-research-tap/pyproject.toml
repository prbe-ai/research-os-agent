[project]
name = "probe-research-tap"
version = "0.9.3"
description = "Claude Code and Codex plugin: ships sanitized coding-agent transcripts to Research OS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tap*"]

# The data files the tap reads at import or run time: the harness registry
# copy (tap/sources.py loads it on import) and the companion's prompt texts.
# Without these a pip-installed tap -- pi's fallback runtime -- dies on import.
[tool.setuptools.package-data]
tap = ["*.json", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
