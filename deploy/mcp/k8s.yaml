# Hosted read-only Research OS MCP on the existing DOKS cluster (namespace `research`),
# behind the ingress-nginx + cert-manager already installed for the API. Stateless,
# no secrets (auth is the caller's per-request Bearer token). Host: mcp.research.prbe.ai.
#
# `__IMAGE__` is a placeholder, NOT a tag: .github/workflows/deploy-mcp.yml substitutes
# the commit-pinned `ghcr.io/prbe-ai/research-os-mcp:sha-<git-sha>` at apply time. This
# file is therefore not `kubectl apply -f`-able as-is, on purpose — the previous version
# pinned a mutable `:0.5.0` that nobody re-pushed, so the deployed service silently drifted
# from main and "what is running?" had no answer. A placeholder fails loudly instead.
# To apply by hand (break-glass), substitute a real SHA — see deploy/mcp/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-os-mcp
  namespace: research
  labels: { app: research-os-mcp }
spec:
  replicas: 2
  selector:
    matchLabels: { app: research-os-mcp }
  template:
    metadata:
      labels: { app: research-os-mcp }
    spec:
      imagePullSecrets:
        - name: probe-ghcr-pull   # same GHCR pull secret research-os uses
      containers:
        - name: mcp
          image: __IMAGE__          # substituted with :sha-<git-sha> by deploy-mcp.yml
          imagePullPolicy: IfNotPresent   # the tag is immutable; re-pulling it buys nothing
          ports: [{ containerPort: 8080 }]
          env:
            # Same-cluster: point at the internal API service to avoid LB hairpin.
            # Swap to https://api.research.prbe.ai if calling the public endpoint.
            - { name: PROBE_BASE_URL, value: "http://research-os.research.svc.cluster.local:8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          # WHY 1Gi, AND WHY NOT MORE.
          #
          # Both replicas were OOMKilled (exit 137) in the `research` namespace
          # on 2026-07-25 at the previous 256Mi. An OOMKilled MCP replica does
          # not fail cleanly: callers get an nginx 502, or a socket that hangs
          # for minutes, and NO request reaches the API. That presents as
          # "search is broken" while the API logs show no search at all, and
          # the misattribution costs far more than the memory ever will.
          #
          # A memory LIMIT reserves nothing -- only `requests` do -- so headroom
          # above the working set is close to free, and "stay near observed
          # usage" is a weak argument for a limit. What actually bounds this is
          # the namespace ResourceQuota, which counts limits.memory across all
          # workloads (2 replicas here):
          #     512Mi/replica -> 13.0Gi / 16Gi   fine
          #       1Gi/replica -> 14.0Gi / 16Gi   fine  <-- here
          #       2Gi/replica -> 16.0Gi / 16Gi   EXHAUSTS THE QUOTA
          # At 2Gi nothing else in `research` can schedule or deploy. THAT is
          # the ceiling -- not comfort about the working set.
          #
          # Measured, not guessed: steady state is ~70MB on both replicas
          # (cgroup memory.current; this cluster has no metrics-server, so
          # `kubectl top` does not work). 256Mi was therefore never a
          # working-set problem -- something transiently allocated past 256MB.
          # `memory.peak` resets on container restart, so the offending spike
          # is not observable after the fact.
          #
          # IF THIS OOMS AGAIN AT 1Gi: do not raise it -- you have nowhere to
          # go without starving the namespace. ~70MB steady against a >1GB
          # spike is a leak or an unbounded buffer, and the next step is
          # profiling the request path.
          #
          # requests stay at 128Mi: comfortably above the ~70MB working set,
          # and requests govern scheduling, not OOM.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: research-os-mcp
  namespace: research
spec:
  selector: { app: research-os-mcp }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-os-mcp
  namespace: research
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Streamable HTTP can hold a response open; give it room.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mcp.research.prbe.ai]
      secretName: research-os-mcp-tls
  rules:
    - host: mcp.research.prbe.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: research-os-mcp
                port: { number: 80 }
