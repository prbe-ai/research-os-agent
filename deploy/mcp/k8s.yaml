# Hosted read-only Research OS MCP on the existing DOKS cluster (namespace `research`),
# behind the ingress-nginx + cert-manager already installed for the API. Stateless,
# no secrets (auth is the caller's per-request Bearer token). Host: mcp.research.prbe.ai.
#
# `__IMAGE__` is a placeholder, NOT a tag: .github/workflows/deploy-mcp.yml substitutes
# the commit-pinned `ghcr.io/prbe-ai/research-os-mcp:sha-<git-sha>` at apply time. This
# file is therefore not `kubectl apply -f`-able as-is, on purpose — the previous version
# pinned a mutable `:0.5.0` that nobody re-pushed, so the deployed service silently drifted
# from main and "what is running?" had no answer. A placeholder fails loudly instead.
# To apply by hand (break-glass), substitute a real SHA — see deploy/mcp/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-os-mcp
  namespace: research
  labels: { app: research-os-mcp }
spec:
  replicas: 2
  selector:
    matchLabels: { app: research-os-mcp }
  template:
    metadata:
      labels: { app: research-os-mcp }
    spec:
      imagePullSecrets:
        - name: probe-ghcr-pull   # same GHCR pull secret research-os uses
      containers:
        - name: mcp
          image: __IMAGE__          # substituted with :sha-<git-sha> by deploy-mcp.yml
          imagePullPolicy: IfNotPresent   # the tag is immutable; re-pulling it buys nothing
          ports: [{ containerPort: 8080 }]
          env:
            # Same-cluster: point at the internal API service to avoid LB hairpin.
            # Swap to https://api.research.prbe.ai if calling the public endpoint.
            - { name: PROBE_BASE_URL, value: "http://research-os.research.svc.cluster.local:8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          # 512Mi, not 256Mi: a replica was OOMKilled (exit 137) in the
          # `research` namespace on 2026-07-25, and an OOMKilled MCP replica
          # does not fail cleanly -- callers get an nginx 502 or a socket that
          # hangs for minutes, which reads as "search is broken" while no
          # request ever reaches the API. That misattribution is the expensive
          # part; the memory is nearly free.
          #
          # Sized from measurement, not guessed: steady state is ~70MB
          # (cgroup memory.current, both replicas), so 256Mi was never a
          # working-set problem -- something transiently allocated past 256MB.
          # memory.peak resets on restart, so the offending spike is no longer
          # observable; 512Mi is the namespace LimitRange default and what
          # every sibling workload (API, reconciler, upload-reaper) already
          # uses, and namespace quota has room (limits.memory 12Gi/16Gi).
          #
          # IF THIS OOMS AGAIN AT 512Mi, do not just raise it: ~70MB steady
          # against a >512MB spike is a leak or an unbounded buffer, and the
          # next step is profiling the request path, not more headroom.
          #
          # requests stay at 128Mi -- comfortably above the ~70MB working set,
          # and requests govern scheduling, not OOM.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: research-os-mcp
  namespace: research
spec:
  selector: { app: research-os-mcp }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-os-mcp
  namespace: research
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Streamable HTTP can hold a response open; give it room.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mcp.research.prbe.ai]
      secretName: research-os-mcp-tls
  rules:
    - host: mcp.research.prbe.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: research-os-mcp
                port: { number: 80 }
