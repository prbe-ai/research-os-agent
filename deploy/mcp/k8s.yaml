# Hosted read-only Research OS MCP on the existing DOKS cluster (namespace `research`),
# behind the ingress-nginx + cert-manager already installed for the API. Stateless,
# no secrets (auth is the caller's per-request Bearer token). Host: mcp.research.prbe.ai.
#
# `__IMAGE__` is a placeholder, NOT a tag: .github/workflows/deploy-mcp.yml substitutes
# the commit-pinned `ghcr.io/prbe-ai/research-os-mcp:sha-<git-sha>` at apply time. This
# file is therefore not `kubectl apply -f`-able as-is, on purpose — the previous version
# pinned a mutable `:0.5.0` that nobody re-pushed, so the deployed service silently drifted
# from main and "what is running?" had no answer. A placeholder fails loudly instead.
# To apply by hand (break-glass), substitute a real SHA — see deploy/mcp/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-os-mcp
  namespace: research
  labels: { app: research-os-mcp }
spec:
  replicas: 2
  # ROLLOUT SHAPE (2026-07-30 incident: old capacity was gone 16s after the
  # first new pod's first readiness pass; the new pods then wedged on their
  # first tool calls and one was liveness-killed, leaving a 502 window).
  # minReadySeconds makes a new pod hold readiness for a minute before the
  # rollout counts it available and removes old capacity. The strategy values
  # equal the computed defaults at 2 replicas — explicit so the intent
  # (never drop below 2 serving pods) survives a replica-count change.
  minReadySeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: research-os-mcp }
  template:
    metadata:
      labels: { app: research-os-mcp }
    spec:
      # Grace must cover preStop (10s) + up to _QUEUE_TIMEOUT_S (20s) waiting
      # for a worker + the in-flight call itself. The MCP surface caps
      # transport retries at 1 (server.py _MCP_MAX_RETRIES), so a single
      # backend read pins a worker ~62s worst case; 180 leaves room for a
      # multi-request tool to finish its current reads. Conservatively sized
      # against the SDK-default budget too (tests/test_mcp_threading.py pins
      # the arithmetic). This is a CEILING, not a wait: the pod exits the
      # moment uvicorn finishes draining. The default 30s force-killed exactly
      # the long requests the preStop drain exists to protect.
      terminationGracePeriodSeconds: 180
      # Two replicas on one node = one node failure zeroes serving capacity,
      # and nothing else here constrains placement. ScheduleAnyway (not
      # DoNotSchedule): a small pool must still schedule both replicas when
      # only one node has room — spread is a strong preference, not a wedge.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: research-os-mcp }
      imagePullSecrets:
        - name: probe-ghcr-pull   # same GHCR pull secret research-os uses
      containers:
        - name: mcp
          image: __IMAGE__          # substituted with :sha-<git-sha> by deploy-mcp.yml
          imagePullPolicy: IfNotPresent   # the tag is immutable; re-pulling it buys nothing
          ports: [{ containerPort: 8080 }]
          env:
            # Same-cluster: point at the internal API service to avoid LB hairpin.
            # Swap to https://api.research.prbe.ai if calling the public endpoint.
            - { name: PROBE_BASE_URL, value: "http://research-os.research.svc.cluster.local:8080" }
            # REQUIRED here, and only because of the line above: entity payloads
            # carry a `url` to the dashboard page, derived from the API host --
            # and this pod's API host is a cluster-internal Service that names no
            # public dashboard at all. Without this, sdk.links correctly declines
            # to guess and every response ships with no link.
            - { name: PROBE_DASHBOARD_URL, value: "https://research.prbe.ai" }
            # Concurrent threaded tool calls per process (server.py _limiters).
            # 16, not the code default 40: the 1Gi memory ceiling below was
            # sized under effectively-serialized dispatch, and N concurrent
            # fat responses (export pages, verbose views) each hold a payload
            # + serialization copy. Tune here — no code release needed — after
            # the post-ship CPU/memory measurement (TODOS.md).
            - { name: PROBE_MCP_TOOL_CAPACITY, value: "16" }
          lifecycle:
            # ingress-nginx removes a terminating pod from its upstreams
            # asynchronously; keep accepting for 10s so routing drains instead
            # of hitting a closed socket (502). Native sleep action — cluster
            # is v1.35, no shell/sleep binary needed in the image.
            preStop:
              sleep:
                seconds: 10
          # PROBE POSTURE (2026-07-30 liveness-kill incident). /healthz is
          # served by the event loop while tool work runs on worker threads
          # (server.py _tool), so healthz answers fast unless the process is
          # truly dead — and it stays SHALLOW on purpose: probing backend
          # reachability here would cascade a backend outage into killing
          # every MCP pod.
          # - Neither probe reflects worker-pool saturation — that is BY
          #   DESIGN: a saturated pod sheds per-request (retryable
          #   "overloaded" tool error + warning log with token fingerprint)
          #   instead of failing readiness, because with 2 replicas pulling a
          #   saturated pod from the LB concentrates all load on its peer.
          #   The readiness timeout below only catches a truly stalled
          #   process, not a busy one.
          # - Liveness is last resort: a tool call may legitimately hold a
          #   worker ~30s (backend timeout budget), so tolerate ~1 min of
          #   unresponsiveness before the kubelet kills the pod. The defaults
          #   (1s timeout × 3 failures) killed a healthy-but-warming replica.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 4
          # WHY 1Gi, AND WHY NOT MORE.
          #
          # Both replicas were OOMKilled (exit 137) in the `research` namespace
          # on 2026-07-25 at the previous 256Mi. An OOMKilled MCP replica does
          # not fail cleanly: callers get an nginx 502, or a socket that hangs
          # for minutes, and NO request reaches the API. That presents as
          # "search is broken" while the API logs show no search at all, and
          # the misattribution costs far more than the memory ever will.
          #
          # A memory LIMIT reserves nothing -- only `requests` do -- so headroom
          # above the working set is close to free, and "stay near observed
          # usage" is a weak argument for a limit. What actually bounds this is
          # the namespace ResourceQuota, which counts limits.memory across all
          # workloads (2 replicas here):
          #     512Mi/replica -> 13.0Gi / 16Gi   fine
          #       1Gi/replica -> 14.0Gi / 16Gi   fine  <-- here
          #       2Gi/replica -> 16.0Gi / 16Gi   EXHAUSTS THE QUOTA
          # At 2Gi nothing else in `research` can schedule or deploy. THAT is
          # the ceiling -- not comfort about the working set.
          #
          # Measured, not guessed: steady state is ~70MB on both replicas
          # (cgroup memory.current; this cluster has no metrics-server, so
          # `kubectl top` does not work). 256Mi was therefore never a
          # working-set problem -- something transiently allocated past 256MB.
          # `memory.peak` resets on container restart, so the offending spike
          # is not observable after the fact.
          #
          # IF THIS OOMS AGAIN AT 1Gi: do not raise it -- you have nowhere to
          # go without starving the namespace. ~70MB steady against a >1GB
          # spike is a leak or an unbounded buffer, and the next step is
          # profiling the request path.
          #
          # requests stay at 128Mi: comfortably above the ~70MB working set,
          # and requests govern scheduling, not OOM.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
# Rollouts respect maxUnavailable, but VOLUNTARY evictions (node drains,
# pool upgrades) do not — without a PDB a routine DOKS maintenance can evict
# both replicas at once and reopen the exact 502 window this manifest exists
# to close. minAvailable 1 makes drains wait for the replacement pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: research-os-mcp
  namespace: research
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: research-os-mcp }
---
apiVersion: v1
kind: Service
metadata:
  name: research-os-mcp
  namespace: research
spec:
  selector: { app: research-os-mcp }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-os-mcp
  namespace: research
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Streamable HTTP can hold a response open; give it room.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [mcp.research.prbe.ai]
      secretName: research-os-mcp-tls
  rules:
    - host: mcp.research.prbe.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: research-os-mcp
                port: { number: 80 }
